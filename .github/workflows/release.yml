name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run checks
        run: npm run check

      - name: Build release assets
        run: npm run build

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          node -e "const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_VERSION;
          const pkg = read('package.json');
          const manifest = read('manifest.json');
          const versions = read('versions.json');
          if (pkg.version !== tag || manifest.version !== tag || versions[tag] !== manifest.minAppVersion)
          throw new Error('Tag, package.json, manifest.json, and versions.json must describe the same release');"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
