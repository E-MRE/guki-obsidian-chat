name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (plain SemVer, e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected plain SemVer (e.g. 1.2.0); non-SemVer and branch names like 'main' are rejected."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run checks
        run: npm run check

      - name: Build release assets
        run: npm run build

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: >-
          node -e "const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_VERSION;
          const pkg = read('package.json');
          const manifest = read('manifest.json');
          const versions = read('versions.json');
          if (pkg.version !== tag || manifest.version !== tag || versions[tag] !== manifest.minAppVersion)
          throw new Error('Tag, package.json, manifest.json, and versions.json must describe the same release');"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for tag $TAG. Uploading assets to existing release..."
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            echo "Creating draft release for tag $TAG..."
            gh release create "$TAG" main.js manifest.json styles.css \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: >-
          gh release edit "$TAG" --draft=false
