name: Bug report
description: Report a reproducible problem in GuKi Chat
title: "bug: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove vault content, credentials,
        access tokens, and other private information from logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were trying to do.
      placeholder: Tell us what you observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: e.g. 1.8.10
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: GuKi Chat version
      placeholder: e.g. 1.1.3
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.6, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only redacted, relevant output. Do not include vault content, secrets, or tokens.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include related plugins, settings, or anything else that may affect the issue.
